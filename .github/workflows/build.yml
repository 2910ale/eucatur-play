# Eucatur Play: compila no Windows (plugin do jogo + app + instalador) a cada envio e publica o instalador.
# Numa tag "v*" cria a versão (Release) com o instalador anexado.
name: Compilar Eucatur Play

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dependências (npm)
        run: npm ci

      - name: Testes da interface
        run: npm test --prefix ui

      - name: Plugin do jogo (westplay.dll)
        run: cargo build --release -p westplay-plugin

      - name: App e instalador
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build --config app/tauri.release.conf.json

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: eucatur-play-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/westplay.dll
          if-no-files-found: error

      - name: Publicar a versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
          generate_release_notes: true
