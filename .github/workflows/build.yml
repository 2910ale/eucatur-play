# Eucatur Play: compila no Windows (plugin do jogo + app + instalador) a cada envio e publica o instalador.
# Cada envio para o main (ou tag "v*") cria a versão (Release) com o instalador anexado.
name: Compilar Eucatur Play

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dependências (npm)
        run: npm ci

      - name: Testes da interface
        run: npm test --prefix ui

      - name: Plugin do jogo (westplay.dll)
        run: cargo build --release -p westplay-plugin

      # O Instalador Eucatur (Ponte, plugin de telemetria, Stream Deck) vai dentro do Eucatur Play: sempre o
      # mais novo do painel da comunidade.
      - name: Instalador Eucatur (vai junto)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/eucatur | Out-Null
          Invoke-WebRequest -Uri https://telemetria.comunidadeucatur.top/api/baixar/windows -OutFile app/eucatur/InstaladorEucatur.exe
          $tamanho = (Get-Item app/eucatur/InstaladorEucatur.exe).Length
          if ($tamanho -lt 1000000) { throw "Instalador Eucatur veio pequeno demais ($tamanho bytes)" }
          "Instalador Eucatur: $tamanho bytes"

      # Cada compilação tem um número de versão maior que a anterior (2.2.<número da compilação>): é assim que
      # o Eucatur Play instalado sabe que tem atualização.
      - name: Versão
        shell: pwsh
        env:
          TEM_CHAVE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e "const f='app/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f,'utf8'));c.version='2.2.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          # Com a chave de assinatura (segredo TAURI_SIGNING_PRIVATE_KEY): o instalador assinado para a atualização automática.
          if ($env:TEM_CHAVE -eq 'true') {
            node -e "const f='app/tauri.release.conf.json';const c=JSON.parse(require('fs').readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          }

      - name: App e instalador
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build --config app/tauri.release.conf.json

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: eucatur-play-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/westplay.dll
          if-no-files-found: error

      - name: Nome fixo do instalador
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $versao = node -p "require('./app/tauri.conf.json').version"
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force publicar | Out-Null
          Copy-Item $exe.FullName publicar/EucaturPlay-Instalador.exe
          if ("${{ github.ref }}".StartsWith('refs/tags/v')) { $tag = "${{ github.ref_name }}" } else { $tag = "v$versao" }
          "TAG=$tag" >> $env:GITHUB_ENV
          # A atualização automática: latest.json com a assinatura do instalador (só com a chave).
          $sig = Get-ChildItem target/release/bundle/nsis/*.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            $json = @{
              version = $versao
              notes = "Eucatur Play $versao"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                'windows-x86_64' = @{
                  signature = (Get-Content $sig.FullName -Raw).Trim()
                  url = "https://github.com/2910ale/eucatur-play/releases/download/$tag/EucaturPlay-Instalador.exe"
                }
              }
            } | ConvertTo-Json -Depth 5
            Set-Content -Path publicar/latest.json -Value $json -Encoding utf8NoBOM
            "latest.json pronto (atualização automática)"
          } else {
            "Sem a chave de assinatura: esta versão não chega pela atualização automática"
          }

      # Cada envio para o main (ou tag v*) vira uma versão no GitHub, então o link
      # .../releases/latest/download/EucaturPlay-Instalador.exe sempre baixa a mais nova.
      - name: Publicar a versão
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Eucatur Play ${{ env.TAG }}
          make_latest: true
          files: |
            publicar/EucaturPlay-Instalador.exe
            publicar/latest.json
          generate_release_notes: true
