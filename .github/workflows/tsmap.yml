name: ts-map Eucatur
on:
  push:
    branches: [tsmap-eucatur]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - run: nuget restore TsMap.sln
      - run: msbuild TsMap.sln /p:Configuration=Release /p:Platform=x64 /m
      - uses: actions/upload-artifact@v4
        with:
          name: tsmap-eucatur-v7
          path: TsMap.Canvas/bin/x64/Release/
          if-no-files-found: error
      # Download público (sem login no GitHub): um zip numa versão própria, marcada como pré-lançamento e
      # nunca como "latest" — a atualização automática do Eucatur Play lê a "latest".
      - name: Publicar o zip para download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path TsMap.Canvas/bin/x64/Release/* -DestinationPath TsMap-Eucatur.zip -Force
          gh release delete tsmap-eucatur --yes --cleanup-tag 2>$null
          gh release create tsmap-eucatur TsMap-Eucatur.zip --target ${{ github.sha }} --title "ts-map Eucatur (exportar mapas para o GPS)" --notes "Abra TsMapCanvas.exe. Use Exportar navegação e radares (Eucatur) e Generate Tile Map (Cities e TileMapInfo)." --prerelease --latest=false
